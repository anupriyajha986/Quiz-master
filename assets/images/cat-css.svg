<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="css-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="css-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="css-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="css-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E40AF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="160" rx="16" fill="url(#css-bg)"/>
  
  <!-- Modern Geometric Ambient Grids -->
  <circle cx="370" cy="30" r="75" fill="url(#css-glow)"/>
  <circle cx="30" cy="130" r="55" fill="url(#css-glow)"/>
  <path d="M-10 40 Q 110 90 220 30 T 410 80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M0 130 Q 140 60 260 140 T 420 70" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Code Snippet Pills in Background -->
  <rect x="24" y="24" width="80" height="24" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="32" y="40" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#BAE6FD">display: grid;</text>

  <rect x="24" y="112" width="88" height="22" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="32" y="127" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#BAE6FD">backdrop-filter</text>

  <!-- Floating UI / Flexbox Grid Palette Preview -->
  <g transform="translate(130, 20)" filter="url(#css-shadow)">
    <!-- Palette Card Frame -->
    <rect width="140" height="118" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="140" height="22" rx="10" fill="#F0F9FF"/>
    <rect y="12" width="140" height="10" fill="#F0F9FF"/>
    <circle cx="12" cy="11" r="3.5" fill="#38BDF8"/>
    <circle cx="22" cy="11" r="3.5" fill="#818CF8"/>
    <circle cx="32" cy="11" r="3.5" fill="#C084FC"/>
    
    <!-- CSS Grid / Flexbox preview cards -->
    <rect x="12" y="32" width="54" height="32" rx="6" fill="#E0F2FE"/>
    <rect x="18" y="38" width="28" height="6" rx="3" fill="#0284C7"/>
    <rect x="18" y="48" width="40" height="4" rx="2" fill="#94A3B8"/>

    <rect x="74" y="32" width="54" height="32" rx="6" fill="#EDE9FE"/>
    <rect x="80" y="38" width="28" height="6" rx="3" fill="#7C3AED"/>
    <rect x="80" y="48" width="40" height="4" rx="2" fill="#94A3B8"/>

    <!-- Bottom Style Spectrum bar -->
    <rect x="12" y="74" width="116" height="12" rx="6" fill="linear-gradient(90deg, #38BDF8, #818CF8, #EC4899)"/>
    <rect x="12" y="94" width="60" height="14" rx="4" fill="#0284C7" fill-opacity="0.1"/>
    <text x="18" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0284C7">Flexbox &amp; Grid</text>
  </g>

  <!-- 3D CSS3 Shield Emblem -->
  <g transform="translate(295, 25)" filter="url(#css-shadow)">
    <circle cx="45" cy="45" r="42" fill="#FFFFFF" fill-opacity="0.2"/>
    <circle cx="45" cy="45" r="34" fill="#FFFFFF"/>
    <!-- CSS3 Shield Icon -->
    <path d="M26 23 L29.5 62 L45 66.5 L60.5 62 L64 23 Z" fill="#0284C7"/>
    <path d="M45 26.5 L45 63 L57.5 59.5 L60.5 26.5 Z" fill="#38BDF8"/>
    <!-- 3 Character White Shapes -->
    <path d="M33 32 L57 32 L56 38 L45 38 L45 42 L55.5 42 L54 53 L45 55.5 L36 53 L35.5 48 L40.5 48 L41 50 L45 51.2 L49 50 L49.5 45.5 L45 45.5 L45 42 L33.5 42 Z" fill="#FFFFFF"/>
  </g>
</svg>
