<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="html-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#E82B91"/>
      <stop offset="100%" stop-color="#7B3FF2"/>
    </linearGradient>
    <linearGradient id="html-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <linearGradient id="html-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="html-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E82B91" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="160" rx="16" fill="url(#html-bg)"/>
  
  <!-- Decorative Grid Lines & Circles -->
  <circle cx="360" cy="20" r="80" fill="url(#html-glow)"/>
  <circle cx="40" cy="140" r="60" fill="url(#html-glow)"/>
  <path d="M-20 60 Q 100 20 200 90 T 420 50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M0 110 Q 120 70 240 130 T 420 100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Mini Code Elements in Background -->
  <rect x="24" y="24" width="76" height="24" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="32" y="40" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#FFE4F2">&lt;!DOCTYPE&gt;</text>

  <rect x="24" y="112" width="70" height="22" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="32" y="127" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#FFE4F2">&lt;main/&gt;</text>

  <!-- Floating Browser Card -->
  <g transform="translate(130, 20)" filter="url(#html-shadow)">
    <!-- Browser Window Frame -->
    <rect width="140" height="118" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Browser Top Bar -->
    <rect width="140" height="22" rx="10" fill="#F8FAFC"/>
    <rect y="12" width="140" height="10" fill="#F8FAFC"/>
    <circle cx="12" cy="11" r="3.5" fill="#EF4444"/>
    <circle cx="22" cy="11" r="3.5" fill="#F59E0B"/>
    <circle cx="32" cy="11" r="3.5" fill="#10B981"/>
    
    <!-- Code Editor Content -->
    <rect x="12" y="32" width="55" height="6" rx="3" fill="#E82B91" fill-opacity="0.8"/>
    <rect x="12" y="44" width="75" height="5" rx="2.5" fill="#64748B" fill-opacity="0.4"/>
    <rect x="20" y="54" width="60" height="5" rx="2.5" fill="#7B3FF2" fill-opacity="0.6"/>
    <rect x="20" y="64" width="85" height="5" rx="2.5" fill="#64748B" fill-opacity="0.4"/>
    <rect x="12" y="74" width="45" height="5" rx="2.5" fill="#E82B91" fill-opacity="0.8"/>
    
    <!-- Preview Mini Box -->
    <rect x="12" y="88" width="116" height="18" rx="4" fill="url(#html-shield)" fill-opacity="0.12"/>
    <text x="18" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#E53935">HTML5 Verified</text>
  </g>

  <!-- 3D HTML5 Shield Emblem -->
  <g transform="translate(295, 25)" filter="url(#html-shadow)">
    <circle cx="45" cy="45" r="42" fill="#FFFFFF" fill-opacity="0.2"/>
    <circle cx="45" cy="45" r="34" fill="#FFFFFF"/>
    <!-- HTML5 Shield Icon -->
    <path d="M26 23 L29.5 62 L45 66.5 L60.5 62 L64 23 Z" fill="#E44D26"/>
    <path d="M45 26.5 L45 63 L57.5 59.5 L60.5 26.5 Z" fill="#F16529"/>
    <!-- 5 Character White Shapes -->
    <path d="M33 32 L57 32 L56 38 L45 38 L45 42 L55.5 42 L54 53 L45 55.5 L36 53 L35.5 48 L40.5 48 L41 50 L45 51.2 L49 50 L49.5 45.5 L34.5 45.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
