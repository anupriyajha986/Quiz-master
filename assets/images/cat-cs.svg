<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="cs-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="cs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4C1D95" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="160" rx="16" fill="url(#cs-bg)"/>
  
  <!-- Ambient Circuit Patterns -->
  <circle cx="360" cy="25" r="75" fill="url(#cs-glow)"/>
  <circle cx="35" cy="135" r="55" fill="url(#cs-glow)"/>
  <path d="M-10 80 L60 80 L90 40 L160 40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="160" cy="40" r="3" fill="#A78BFA"/>
  <path d="M220 140 L280 140 L310 110 L410 110" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <circle cx="280" cy="140" r="3" fill="#F472B6"/>

  <!-- Code Snippet Pills in Background -->
  <rect x="24" y="24" width="84" height="24" rx="6" fill="rgba(255,255,255,0.16)"/>
  <text x="32" y="40" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#E0E7FF">O(N log N)</text>

  <rect x="24" y="112" width="76" height="22" rx="6" fill="rgba(255,255,255,0.16)"/>
  <text x="32" y="127" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#E0E7FF">SQL &amp; DBMS</text>

  <!-- Floating System Architecture Card -->
  <g transform="translate(130, 20)" filter="url(#cs-shadow)">
    <rect width="140" height="118" rx="10" fill="#0F172A"/>
    <rect width="140" height="22" rx="10" fill="#1E1B4B"/>
    <rect y="12" width="140" height="10" fill="#1E1B4B"/>
    <circle cx="12" cy="11" r="3.5" fill="#A855F7"/>
    <circle cx="22" cy="11" r="3.5" fill="#6366F1"/>
    <circle cx="32" cy="11" r="3.5" fill="#EC4899"/>
    
    <!-- Tree / Graph nodes representation -->
    <circle cx="70" cy="38" r="8" fill="#818CF8"/>
    <text x="67" y="41" font-family="sans-serif" font-size="8" font-weight="700" fill="#FFF">A</text>
    <line x1="64" y1="44" x2="42" y2="60" stroke="#6366F1" stroke-width="2"/>
    <line x1="76" y1="44" x2="98" y2="60" stroke="#6366F1" stroke-width="2"/>
    <circle cx="38" cy="64" r="7" fill="#C084FC"/>
    <text x="35" y="67" font-family="sans-serif" font-size="7" font-weight="700" fill="#FFF">B</text>
    <circle cx="102" cy="64" r="7" fill="#F472B6"/>
    <text x="99" y="67" font-family="sans-serif" font-size="7" font-weight="700" fill="#FFF">C</text>

    <!-- Mini Terminal Output -->
    <rect x="12" y="82" width="116" height="26" rx="4" fill="#1E293B"/>
    <text x="18" y="94" font-family="'Fira Code', monospace" font-size="8" fill="#38BDF8">CPU &bull; OS &bull; Networks</text>
    <text x="18" y="103" font-family="'Fira Code', monospace" font-size="7.5" fill="#34D399">&gt; Binary Search Tree OK</text>
  </g>

  <!-- 3D CPU Microchip Emblem -->
  <g transform="translate(295, 25)" filter="url(#cs-shadow)">
    <circle cx="45" cy="45" r="42" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="20" y="20" width="50" height="50" rx="10" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
    <!-- CPU Core -->
    <rect x="30" y="30" width="30" height="30" rx="6" fill="url(#cs-chip)"/>
    <text x="38" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">CPU</text>
    <!-- Chip Pins -->
    <line x1="28" y1="16" x2="28" y2="20" stroke="#DDD6FE" stroke-width="2"/>
    <line x1="45" y1="16" x2="45" y2="20" stroke="#DDD6FE" stroke-width="2"/>
    <line x1="62" y1="16" x2="62" y2="20" stroke="#DDD6FE" stroke-width="2"/>
    <line x1="28" y1="70" x2="28" y2="74" stroke="#DDD6FE" stroke-width="2"/>
    <line x1="45" y1="70" x2="45" y2="74" stroke="#DDD6FE" stroke-width="2"/>
    <line x1="62" y1="70" x2="62" y2="74" stroke="#DDD6FE" stroke-width="2"/>
  </g>
</svg>
