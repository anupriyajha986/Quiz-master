<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gk-globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="gk-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="gk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="160" rx="16" fill="url(#gk-bg)"/>
  
  <!-- Ambient Orbit Lines & Latitude circles -->
  <circle cx="360" cy="25" r="75" fill="url(#gk-glow)"/>
  <circle cx="35" cy="135" r="55" fill="url(#gk-glow)"/>
  <path d="M-10 60 Q 120 120 250 40 T 410 90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- GK Knowledge Pills in Background -->
  <rect x="24" y="24" width="86" height="24" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="32" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#D1FAE5">World Capitals</text>

  <rect x="24" y="112" width="80" height="22" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="32" y="127" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#D1FAE5">Science &amp; ISRO</text>

  <!-- Floating Discovery / Encyclopedia Card -->
  <g transform="translate(130, 20)" filter="url(#gk-shadow)">
    <rect width="140" height="118" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="140" height="22" rx="10" fill="#ECFDF5"/>
    <rect y="12" width="140" height="10" fill="#ECFDF5"/>
    <circle cx="12" cy="11" r="3.5" fill="#10B981"/>
    <circle cx="22" cy="11" r="3.5" fill="#06B6D4"/>
    <circle cx="32" cy="11" r="3.5" fill="#3B82F6"/>
    
    <!-- Atom & Discovery Icons -->
    <ellipse cx="70" cy="52" rx="28" ry="12" fill="none" stroke="#10B981" stroke-width="1.5" transform="rotate(30 70 52)"/>
    <ellipse cx="70" cy="52" rx="28" ry="12" fill="none" stroke="#06B6D4" stroke-width="1.5" transform="rotate(-30 70 52)"/>
    <circle cx="70" cy="52" r="6" fill="#059669"/>

    <rect x="12" y="78" width="116" height="18" rx="4" fill="#F0FDF4"/>
    <text x="18" y="91" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#047857">History &bull; Geography &bull; Sports</text>

    <rect x="12" y="100" width="75" height="12" rx="3" fill="#D1FAE5"/>
    <text x="16" y="109" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#065F46">200 Master Qs</text>
  </g>

  <!-- 3D Earth Globe / Compass Emblem -->
  <g transform="translate(295, 25)" filter="url(#gk-shadow)">
    <circle cx="45" cy="45" r="42" fill="#FFFFFF" fill-opacity="0.2"/>
    <circle cx="45" cy="45" r="34" fill="#0284C7"/>
    <!-- Continents on Globe -->
    <path d="M25 38 Q 32 30 42 35 Q 46 45 35 48 Z" fill="#34D399"/>
    <path d="M50 30 Q 62 32 60 44 Q 52 48 48 40 Z" fill="#34D399"/>
    <path d="M38 52 Q 48 50 46 68 Q 38 65 35 58 Z" fill="#34D399"/>
    <path d="M52 50 Q 64 54 58 64 Q 50 62 52 50 Z" fill="#34D399"/>
    <!-- Compass Sparkle Badge -->
    <circle cx="68" cy="22" r="11" fill="#FBBF24"/>
    <text x="63.5" y="27" font-family="sans-serif" font-size="14" fill="#78350F">💡</text>
  </g>
</svg>
